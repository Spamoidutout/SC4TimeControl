; SC4 Time Control settings (read when the game starts)
[TimeControl]

; Speed of the day/night cycle when a city is loaded:
; 1/2, x1, x2, x4 or x8 (x1 = the game's normal speed)
DefaultSpeed=x1

; 1 = the last speed picked in the menu becomes the default speed
;     (the game updates DefaultSpeed above)
; 0 = always start with DefaultSpeed
RememberLastSpeed=0
